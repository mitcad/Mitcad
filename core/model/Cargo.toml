# SPDX-License-Identifier: MIT
[package]
name = "mitcad-model"
description = "Parametric model, feature history and recompute logic for Mitcad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mitcad-solver = { path = "../solver" }
# Vector helpers on [f64; 3], shared with the solver and the readers.
mitcad-vec3 = { path = "../vec3" }
# Preview images: the camera, the rasterizer and the PNG writer of
# model_render (mitcad#1486).
mitcad-preview = { path = "../preview" }
serde.workspace = true
serde_json.workspace = true
# Imported bodies and sketch export (data exchange).
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
mitcad-dxf = { path = "../dxf" }
# 3MF export for slicers (mitcad#13).
mitcad-3mf = { path = "../3mf" }
# USDZ export for AR viewers and other programs (mitcad#123).
mitcad-usdz = { path = "../usdz" }
# The print settings files of slicers (XML).
roxmltree = "0.20.0"
# Parameter expressions and the print settings' key map, crates of their
# own re-exported as `expr` and `print_keys` (mitcad#777).
mitcad-expr = { path = "../expr" }
mitcad-print-keys = { path = "../print-keys" }
# The Kernel trait and the base data below the model's core, re-exported
# at their old paths (mitcad#777).
mitcad-model-base = { path = "../model-base" }
# The mock kernel, re-exported as `mitcad_model::testing` under the
# `testing` feature (mitcad#777).
mitcad-model-testkit = { path = "../model-testkit", optional = true }
# The general sketch below the model's core, re-exported as
# `mitcad_model::sketch` (mitcad#780).
mitcad-sketch = { path = "../sketch" }
# CAM: toolpaths, machines and the post-processors (mitcad#1013), below
# the model; re-exported as `mitcad_model::cam::engine`.
mitcad-cam = { path = "../cam" }
# The design packed into a zip for a report (mitcad#1795).
mitcad-zip = { path = "../zip" }

[dev-dependencies]
# The mock kernel of the model's own unit tests (mitcad#777).
mitcad-model-testkit = { path = "../model-testkit" }

[features]
# The mock geometry kernel (`mitcad_model::testing`, the crate
# mitcad-model-testkit) and the shared test fixtures
# (`mitcad_model::test_support`) for other crates' tests.
testing = ["dep:mitcad-model-testkit"]
