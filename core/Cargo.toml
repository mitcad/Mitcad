# SPDX-License-Identifier: MIT
[workspace]
resolver = "3"
members = ["model", "ffi", "solver", "f3d", "dxf", "import", "vcs", "zip", "freecad", "3mf", "update", "ipt", "mcp", "usdz", "ifc", "cfb", "rvt", "solidcraft", "dwg", "vec3", "dump", "asm", "f3d-names", "f3d-file", "f3d-design", "expr", "print-keys", "import-base", "import-ifc", "import-rvt", "import-fcstd", "model-api", "model-tests/support", "model-tests/api", "model-tests/appearance", "model-tests/analysis", "model-tests/sketch", "model-tests/sketch-refs", "model-tests/features-profile", "model-tests/features-solid", "model-tests/parts", "model-tests/sheet", "model-tests/assembly", "model-tests/joints", "model-tests/links", "model-tests/drawing", "model-tests/drawing-views", "model-tests/print", "model-tests/files", "model-tests/build-frames", "model-tests/build-timber", "model-base", "model-testkit", "model-build", "model-diff", "model-drawing", "sketch", "f3d-decode", "import-solidcraft", "import-replay", "import-joints", "import-sheet", "import-primitives", "../tools/testrun", "import-appearances", "ffi-staticlib", "model-tests/imports"]

[workspace.package]
version = "0.37.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[workspace.dependencies]
cxx = "1.0.202"
mitcad-model = { path = "model" }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: parsed numbers equal the saved ones exactly.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# The dev profile (the CMake Debug build and cargo test) optimises, so that
# the tests run faster: the dependencies fully, Mitcad's own crates a
# little. Debug information and debug assertions stay.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# cargo test (the crates' test builds, core.cargo_build) keeps line tables
# only: panics and backtraces still name the files and lines, and each test
# binary, which links its dependencies statically, its .pdb file and its
# link get much smaller (mitcad#796). The application's builds (Corrosion:
# the dev and release profiles) and so its crash reports keep their full
# debug information. To step through a test in a debugger with variables,
# build it with CARGO_PROFILE_TEST_DEBUG=true.
[profile.test]
debug = "line-tables-only"
