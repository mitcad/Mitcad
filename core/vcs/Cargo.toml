# SPDX-License-Identifier: MIT
[package]
name = "mitcad-vcs"
description = "Local version history of Mitcad projects (git repositories, gitoxide)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Exact version: gix is 0.x and breaks its API about monthly; an update is a
# task of its own (tests, cargo deny). Objects, trees, commits, references,
# the revision walk and the index are all P12 needs. The default features
# are not allowed: one of them pulls in an MPL-2.0 crate (cargo deny).
# The blocking HTTP client fetches libraries over https and http without
# the git program (mitcad#1224): reqwest, its TLS chosen below.
gix = { version = "=0.88.0", default-features = false, features = ["sha1", "index", "blocking-http-transport-reqwest"] }
# The TLS of gix's HTTP client: rustls with no crypto provider of its own
# (reqwest's `rustls` feature brings aws-lc-rs, whose C library needs CMake
# and NASM and carries the OpenSSL licence); remote/https.rs installs ring,
# which the live updates use already. Certificates are checked against the
# system's roots (rustls-platform-verifier): no OpenSSL anywhere.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
mitcad-model.workspace = true
# Comparison of two designs or versions (P12c, mitcad#777).
mitcad-model-diff = { path = "../model-diff" }
serde.workspace = true
serde_json.workspace = true

# Live updates (mitcad#89, remote/mqtt.rs): TLS in Rust, with ring as the
# crypto provider (the default aws-lc-rs needs CMake and NASM to build) and
# the system's root certificates checked by rustls-webpki.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"

[target.'cfg(unix)'.dependencies]
# setsid() and kill() for the git program (remote/cli.rs): git runs without
# the terminal Mitcad was started from, and a cancel ends its children too.
libc = "0.2.190"

[dev-dependencies]
# The mock geometry kernel for documents read from older versions.
mitcad-model = { workspace = true, features = ["testing"] }
mitcad-model-api = { path = "../model-api" }
