# SPDX-License-Identifier: MIT
[package]
name = "mitcad-thumbnailer-capi"
description = "The static library of MitCad's thumbnail C ABI, linked by the Windows and macOS file managers' thumbnail extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Corrosion imports this package on Windows and macOS (core/CMakeLists.txt)
# as the target `mitcad_thumbnailer_capi`, which the thumbnail handler
# mitcad-thumbnails.dll (app/thumbnails, mitcad#1695) and the Quick Look
# extension MitCadThumbnails.appex (mitcad#1696, cmake/MacQuickLook.cmake)
# link. The functions
# are in the rlib `mitcad-thumbnailer` (src/capi.rs), tested there.
[lib]
name = "mitcad_thumbnailer_capi"
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
mitcad-thumbnailer = { path = "../thumbnailer" }
