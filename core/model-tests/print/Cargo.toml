# SPDX-License-Identifier: MIT
[package]
name = "mitcad-model-tests-print"
description = "Tests of the Mitcad model through its JSON api: print"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dev-dependencies]
mitcad-model = { workspace = true, features = ["testing"] }
mitcad-model-api = { path = "../../model-api" }
mitcad-model-diff = { path = "../../model-diff" }
serde_json.workspace = true
mitcad-3mf = { path = "../../3mf" }
# Slicers' preset bundles (zips) the print settings tests write (mitcad#640).
mitcad-zip = { path = "../../zip" }
# The print colours of a USDZ export read back (mitcad#1596).
mitcad-usdz = { path = "../../usdz" }
