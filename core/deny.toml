# SPDX-License-Identifier: MIT
# cargo-deny policy for the Rust dependencies (licence policy:
# docs/development.md). Run: tools/check-dependencies.sh

[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the check; so do yanked crates.
yanked = "deny"

[licenses]
# Permissive licences only. Taking in a copyleft licence (for example GPL-3.0
# for a constraint solver) is a project decision, not a dependency update.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory of current dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
