# SPDX-License-Identifier: MIT
[package]
name = "mitcad-mcp"
description = "Local MCP stdio protocol for Mitcad document tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
mitcad-zip = { path = "../zip" }

# The names MCP permits, which the guides may use (mitcad#1508): the
# application gives the same lists to model_reference (core/ffi/src/mcp.rs).
[dev-dependencies]
mitcad-model.workspace = true
mitcad-model-api = { path = "../model-api" }
