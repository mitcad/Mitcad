# SPDX-License-Identifier: MIT
[package]
name = "mitcad-solver"
description = "2D sketch constraint solver, spatial point/line solver and assembly joint solver for Mitcad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No third-party dependencies: the linear algebra (sparse LDL^T with a
# minimum degree ordering) and the automatic differentiation are part of
# the crate.
[dependencies]
# Vector helpers on [f64; 3] (dependency-free).
mitcad-vec3 = { path = "../vec3" }
