# SPDX-License-Identifier: MIT
[package]
name = "mitcad-ipt"
description = "Reader for .ipt part and .iam assembly files: compound file container, property sets, the segment database, the B-rep record and assemblies' occurrences"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_ipt"

[[bin]]
name = "mitcad-ipt-inspect"
path = "src/bin/mitcad-ipt-inspect.rs"

[dependencies]
# The compound file container (MS-CFB), shared with the .rvt reader.
mitcad-cfb = { path = "../cfb" }
# The B-rep record holds an ASM binary file, read and converted by the
# ASM code the .f3d reader uses.
mitcad-asm = { path = "../asm" }
# The design as the import's dump IR.
mitcad-dump = { path = "../dump" }
# Vector helpers on [f64; 3].
mitcad-vec3 = { path = "../vec3" }
# The appearance assets of the `Protein` stream, the same packages as the
# `.f3d` documents' (mitcad#1367).
mitcad-f3d-file = { path = "../f3d-file" }
# The faces of the stored bodies and points inside them, for the faces'
# appearances (mitcad#1367).
mitcad-f3d-names = { path = "../f3d-names" }
# Pure-Rust decompressors of the segment streams (zlib, zstd); zlib also
# compresses (test files).
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# The design as the import's dump IR (JSON) and the report summaries.
serde = { workspace = true }
serde_json = { workspace = true }

# No dev-dependency on the model or the import (mitcad#831): the test
# designs replayed by the import on the model's mock kernel are tested in
# core/model-tests/imports (`ipt_design_tests.rs`), so that the release
# profile's test build, which this crate's tests are in, builds neither.
