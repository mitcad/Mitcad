# SPDX-License-Identifier: MIT
[package]
name = "mitcad-model-testkit"
description = "The mock geometry kernel of the Mitcad model's tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Only the model's base: the model depends on this crate (its `testing`
# feature and its tests), so this crate must not depend on the model.
[dependencies]
# Shown messages checked in the tests (mitcad#1612).
mitcad-model-base = { path = "../model-base", features = ["strict-user-text"] }
# Vector helpers on [f64; 3].
mitcad-vec3 = { path = "../vec3" }
serde.workspace = true
serde_json.workspace = true
