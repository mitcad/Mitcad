# SPDX-License-Identifier: MIT
[package]
name = "mitcad-freecad"
description = "Reader for FreeCAD .FCStd documents: container, objects and their properties, placements, links, view data and stored shapes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_freecad"

[[bin]]
name = "mitcad-fcstd-inspect"
path = "src/bin/mitcad-fcstd-inspect.rs"

[dependencies]
mitcad-zip = { path = "../zip" }
# Document.xml and GuiDocument.xml; DTDs (and so entity expansion) refused.
roxmltree = "0.20.0"
serde.workspace = true
serde_json.workspace = true
