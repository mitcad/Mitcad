# /etc/wsl.conf for an isolated Mitcad development distro.
#
# Build scripts of dependencies (Cargo build scripts, vcpkg ports, pip
# packages) run inside the distro. These settings keep them away from the
# Windows side: they cannot start Windows programs or see Windows drives.
# The Windows side can still reach the distro (wsl.exe, \\wsl.localhost).
#
# Apply with `wsl --terminate <distro>` after copying to /etc/wsl.conf.

[boot]
systemd=true

[interop]
# Linux processes cannot launch Windows executables.
enabled=false
appendWindowsPath=false

[automount]
# Windows drives (C:\ and others) are not mounted under /mnt.
enabled=false
mountFsTab=false
